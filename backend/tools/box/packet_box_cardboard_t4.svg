DROP 22.0</text><text x="79.60" y="192.40" font-size="5" text-anchor="middle">RETURN 10.8</text><text x="79.60" y="199.40" font-size="5" text-anchor="middle">tabs 12 x 30</text><text x="201.00" y="134.20" font-size="5" text-anchor="middle">FLAP 25</text><text x="201.00" y="475.60" font-size="5" text-anchor="middle">FLAP 25</text><text x="826.70" y="427.90" font-size="6.0" text-anchor="middle">LID FLAP 40</text><text x="826.70" y="296.90" font-size="6.0" text-anchor="middle">LID</text><text x="826.70" y="306.90" font-size="6.0" text-anchor="middle">224.6 x 202.0</text><text x="1094.70" y="152.00" font-size="6" text-anchor="middle">LINER FLOOR AND LID, cut 2</text><text x="1094.70" y="162.00" font-size="6" text-anchor="middle">211.4 x 188.0</text><text x="1094.70" y="326.20" font-size="6" text-anchor="middle">LINER SIDE, cut 2</text><text x="1094.70" y="336.20" font-size="6" text-anchor="middle">211.4 x 136.4</text><text x="1078.00" y="474.60" font-size="6" text-anchor="middle">LINER END, cut 2</text><text x="1078.00" y="484.60" font-size="6" text-anchor="middle">178.0 x 136.4</text><text x="40.0" y="571.80" font-size="6">Packet cardboard box, prototype 1 (BX-005 / BX-006). Board 4 mm. All sizes mm, drawn 1:1, creases at the board mid-plane. This face is the inside of the box.</text><text x="40.0" y="583.80" font-size="6">Solid black: cut. Dashed blue: crease, fold toward you. Dash-dot orange: crease, fold away from you (score it on the back).</text><text x="40.0" y="595.80" font-size="6">Each end: fold the wall up, the ledge out, the drop panel down and the return panel in. Push the tabs through the wall slots, fold them down and tape them.</text><text x="40.0" y="607.80" font-size="6">HEM: fold it up and back so it lies on top of the ledge, then glue it. It is the second layer of the ledge the jaws lift on. Tape the dust flaps to the end walls.</text><text x="40.0" y="619.80" font-size="6">Marks along the length from the left edge to the centre: 0.0 | 12.0 | 22.8 | 44.8 | 57.6 | 204.0 | 208.0 | 312.2. Across from the top edge: 0 | 148.4 | 244.9 (centre). All four quarters are the same.</text><text x="40.0" y="631.80" font-size="6">Folded: 246.0 long, 197.0 wide (206.0 over the lid flaps), 154.4 to the lid top. Inside 212.4 x 189.0 x 146.4. Blank: body 624.4 x 489.8, lid 224.6 x 282.0.</text><text x="40.0" y="643.80" font-size="6">Green: foil bubble liner, 5 mm thick, a different material. Cut 2 of each. Tape the floor, sides and ends inside the box and glue the last piece under the lid. Room left for food: 202 x 179 x 136.</text></g>
