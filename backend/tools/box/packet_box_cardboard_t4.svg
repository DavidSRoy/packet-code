ize="4.2">31.0</text><text x="866.00" y="295.98" text-anchor="middle" font-size="4.2">slot 136.0</text><text x="949.50" y="295.98" text-anchor="middle" font-size="4.2">31.0</text><text x="206.00" y="153.75" font-size="6.0" text-anchor="middle">LID</text><text x="206.00" y="163.75" font-size="6.0" text-anchor="middle">224.6 x 193.5</text><text x="206.00" y="175.75" font-size="5" text-anchor="middle">the tags go on the other face</text><text x="206.00" y="54.50" font-size="5" text-anchor="middle">TUCK FLAP 25</text><text transform="translate(74.10 333.95) rotate(-90)" font-size="5" text-anchor="middle">TAB 25</text><text x="72.50" y="516.90" text-anchor="middle" font-size="5.0">tab 25.0</text><text x="206.00" y="516.90" text-anchor="middle" font-size="5.0">side A 242.0</text><text x="426.00" y="516.90" text-anchor="middle" font-size="5.0">end 1 198.0</text><text x="646.00" y="516.90" text-anchor="middle" font-size="5.0">side B 242.0</text><text x="865.50" y="516.90" text-anchor="middle" font-size="5.0">end 2 197.0</text><text x="512.00" y="534.90" text-anchor="middle" font-size="5.0">overall 904.0</text><text x="120.85" y="25.00" text-anchor="middle" font-size="5.0">54.3</text><text x="206.00" y="25.00" text-anchor="middle" font-size="5.0">tuck 116.0</text><text x="291.15" y="25.00" text-anchor="middle" font-size="5.0">54.3</text><text x="206.00" y="9.00" text-anchor="middle" font-size="5.0">lid 224.6</text><text transform="translate(54.00 52.50) rotate(-90)" text-anchor="middle" font-size="5.0">tuck 25.0</text><text transform="translate(54.00 161.75) rotate(-90)" text-anchor="middle" font-size="5.0">lid 193.5</text><text transform="translate(54.00 333.95) rotate(-90)" text-anchor="middle" font-size="5.0">side A 150.9</text><text transform="translate(54.00 458.65) rotate(-90)" text-anchor="middle" font-size="5.0">flap 98.5</text><text transform="translate(34.00 273.95) rotate(-90)" text-anchor="middle" font-size="5.0">overall 467.9</text><text transform="translate(984.00 232.50) rotate(-90)" text-anchor="middle" font-size="5.0">ledge flap 60.0</text><text transform="translate(984.00 333.95) rotate(-90)" text-anchor="middle" font-size="5.0">end wall 142.9</text><text transform="translate(984.00 454.65) rotate(-90)" text-anchor="middle" font-size="5.0">flap 98.5</text><text x="1142.50" y="148.50" font-size="6" text-anchor="middle">LINER FLOOR, cut 1</text><text x="1142.50" y="158.50" font-size="6" text-anchor="middle">237.0 x 193.0</text><text x="1130.70" y="353.50" font-size="6" text-anchor="middle">LINER TOP, cut 1</text><text x="1130.70" y="363.50" font-size="6" text-anchor="middle">213.4 x 193.0</text><text x="1399.50" y="116.45" font-size="6" text-anchor="middle">LINER SIDE, cut 2</text><text x="1399.50" y="126.45" font-size="6" text-anchor="middle">237.0 x 128.9</text><text x="1372.50" y="257.35" font-size="6" text-anchor="middle">LINER END, cut 2</text><text x="1372.50" y="267.35" font-size="6" text-anchor="middle">183.0 x 128.9</text><text x="1372.50" y="193.90" font-size="4.5" text-anchor="middle">notch 146 x 22</text><text x="60.0" y="561.90" font-size="6">Packet cardboard box for the current gripper, prototype 3. Board 4 mm. All sizes mm, drawn 1:1, creases at the board mid-plane. This face is the inside of the box.</text><text x="60.0" y="573.90" font-size="6">Solid black: cut. Dashed blue: crease. Every fold goes toward you.</text><text x="60.0" y="585.90" font-size="6">Jaw slots: cut right out. The slot top stops 2 mm below the ledge flap crease. Do not cut into the crease. The gripper's hook goes through the slot and sits under the folded ledge flap.</text><text x="60.0" y="597.90" font-size="6">Fold the walls into a tube and fix the tab inside END 2. Fold the END bottom flaps in first, then the SIDE flaps, and tape the seam.</text><text x="60.0" y="609.90" font-size="6">Fold the ledge flaps in, close the lid onto them, tuck its flap inside SIDE B and tape the whole front edge. The lid holds the ledge flaps down when the hooks lift.</text><text x="60.0" y="621.90" font-size="6">Folded: 246 long, 202 wide, 154.9 to the lid top. Inside 238.0 x 194.0 x 138.9. Blank 904.0 x 467.9.</text><text x="60.0" y="633.90" font-size="6">Green: foil bubble liner, 5 mm thick, a different material. The notch in the END pieces and the short TOP piece keep the jaw slots clear. Room left for food: 228 x 184 x 129.</text></g>
