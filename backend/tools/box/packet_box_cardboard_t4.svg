<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="216.00" y="347.95" font-size="11.0" text-anchor="middle">SIDE A (back)</text><text x="216.00" y="362.95" font-size="9" text-anchor="middle">242.0 x 150.9</text><text x="216.00" y="478.65" font-size="9" text-anchor="middle">FLAP 98.5</text><text x="656.00" y="347.95" font-size="11.0" text-anchor="middle">SIDE B (front)</text><text x="656.00" y="362.95" font-size="9" text-anchor="middle">242.0 x 152.9</text><text x="656.00" y="478.65" font-size="9" text-anchor="middle">FLAP 98.5</text><text x="216.00" y="383.95" font-size="8" text-anchor="middle">&#8593; flutes run up the walls &#8595;</text><text x="436.00" y="365.40" font-size="11.0" text-anchor="middle">END 1</text><text x="436.00" y="380.40" font-size="9" text-anchor="middle">198.0 x 142.9</text><text x="436.00" y="474.65" font-size="9" text-anchor="middle">FLAP 98.5</text><text x="436.00" y="251.50" font-size="9" text-anchor="middle">LEDGE FLAP 60</text><text x="436.00" y="263.50" font-size="7.5" text-anchor="middle">the jaw's lower prong sits under this</text><text x="436.00" y="298.20" font-size="7.5" text-anchor="middle">JAW SLOT: cut out</text><text x="352.50" y="316.00" text-anchor="middle" font-size="7.5">31.0</text><text x="436.00" y="316.00" text-anchor="middle" font-size="7.5">slot 136.0</text><text x="519.50" y="316.00" text-anchor="middle" font-size="7.5">31.0</text><text transform="translate(525.00 295.50) rotate(-90)" text-anchor="middle" font-size="7.5">22.0</text><text x="876.00" y="365.40" font-size="11.0" text-anchor="middle">END 2</text><text x="876.00" y="380.40" font-size="9" text-anchor="middle">197.0 x 142.9</text><text x="876.00" y="474.65" font-size="9" text-anchor="middle">FLAP 98.5</text><text x="876.00" y="251.50" font-size="9" text-anchor="middle">LEDGE FLAP 60</text><text x="876.00" y="263.50" font-size="7.5" text-anchor="middle">the jaw's lower prong sits under this</text><text x="876.00" y="298.20" font-size="7.5" text-anchor="middle">JAW SLOT: cut out</text><text x="792.50" y="316.00" text-anchor="middle" font-size="7.5">31.0</text><text x="876.00" y="316.00" text-anchor="middle" font-size="7.5">slot 136.0</text><text x="959.00" y="316.00" text-anchor="middle" font-size="7.5">30.0</text><text transform="translate(965.00 295.50) rotate(-90)" text-anchor="middle" font-size="7.5">22.0</text><text x="216.00" y="167.75" font-size="11.0" text-anchor="middle">LID</text><text x="216.00" y="182.75" font-size="9" text-anchor="middle">224.6 x 193.5</text><text x="216.00" y="196.75" font-size="8" text-anchor="middle">centred on side A: 8.7 in from each end of it</text><text x="216.00" y="209.75" font-size="8" text-anchor="middle">the tags go on the other face</text><text x="216.00" y="75.50" font-size="9" text-anchor="middle">TUCK FLAP 25</text><text transform="translate(85.50 353.95) rotate(-90)" font-size="9" text-anchor="middle">TAB 25 x 134.9</text><text x="82.50" y="541.10" text-anchor="middle" font-size="8.0">25.0</text><text x="216.00" y="541.10" text-anchor="middle" font-size="8.0">side A 242.0</text><text x="436.00" y="541.10" text-anchor="middle" font-size="8.0">end 1 198.0</text><text x="656.00" y="541.10" text-anchor="middle" font-size="8.0">side B 242.0</text><text x="875.50" y="541.10" text-anchor="middle" font-size="8.0">end 2 197.0</text><text x="522.00" y="565.10" text-anchor="middle" font-size="8.0">overall 904.0</text><text x="130.85" y="37.20" text-anchor="middle" font-size="8.0">54.3</text><text x="216.00" y="37.20" text-anchor="middle" font-size="8.0">tuck 116.0</text><text x="301.15" y="37.20" text-anchor="middle" font-size="8.0">54.3</text><text x="216.00" y="15.20" text-anchor="middle" font-size="8.0">lid 224.6</text><text transform="translate(62.80 72.50) rotate(-90)" text-anchor="middle" font-size="8.0">25.0</text><text transform="translate(62.80 181.75) rotate(-90)" text-anchor="middle" font-size="8.0">lid 193.5</text><text transform="translate(62.80 353.95) rotate(-90)" text-anchor="middle" font-size="8.0">side A 150.9</text><text transform="translate(62.80 478.65) rotate(-90)" text-anchor="middle" font-size="8.0">flap 98.5</text><text transform="translate(36.80 293.95) rotate(-90)" text-anchor="middle" font-size="8.0">overall 467.9</text><text transform="translate(1004.80 252.50) rotate(-90)" text-anchor="middle" font-size="8.0">ledge flap 60.0</text><text transform="translate(1004.80 353.95) rotate(-90)" text-anchor="middle" font-size="8.0">end wall 142.9</text><text transform="translate(1004.80 474.65) rotate(-90)" text-anchor="middle" font-size="8.0">flap 98.5</text><text x="70.0" y="601.90" font-size="9">Packet cardboard box, prototype 3: the flat blank. Board 4 mm. All sizes mm, drawn 1:1, creases at the board mid-plane. This face is the inside of the box.</text><text x="70.0" y="615.90" font-size="9">Solid black: cut. Dashed blue: crease. Every fold goes toward you. The bottom flaps and the ledge flaps stop 2.5 short of the wall creases at each side.</text><text x="70.0" y="629.90" font-size="9">Jaw slots: 136 x 22, cut right out. The slot top stops 2 below the ledge flap crease. Do not cut into the crease.</text><text x="70.0" y="643.90" font-size="9">Fold the walls into a tube and fix the tab inside END 2. Fold the END bottom flaps in first, then the SIDE flaps, and tape the seam.</text><text x="70.0" y="657.90" font-size="9">Fold the ledge flaps in, close the lid onto them, tuck its flap inside SIDE B and tape the whole front edge. The lid holds the ledge flaps down when the jaws lift.</text><text x="70.0" y="671.90" font-size="9">Folded: 246 long, 202 wide, 154.9 to the lid top. Inside 238.0 x 194.0 x 138.9. Blank 904.0 x 467.9. The outside faces are on the folded sheet.</text></g>
