<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="206.00" y="329.70" font-size="6.0" text-anchor="middle">SIDE A (back)</text><text x="206.00" y="339.70" font-size="6.0" text-anchor="middle">242.0 x 150.4</text><text x="206.00" y="458.15" font-size="5" text-anchor="middle">FLAP 98.5</text><text x="646.00" y="329.70" font-size="6.0" text-anchor="middle">SIDE B (front)</text><text x="646.00" y="339.70" font-size="6.0" text-anchor="middle">242.0 x 152.4</text><text x="646.00" y="458.15" font-size="5" text-anchor="middle">FLAP 98.5</text><text x="206.00" y="355.70" font-size="5" text-anchor="middle">&#8593; flutes run up the walls &#8595;</text><text x="426.00" y="348.90" font-size="6.0" text-anchor="middle">END 1</text><text x="426.00" y="358.90" font-size="6.0" text-anchor="middle">198.0 x 142.4</text><text x="426.00" y="454.15" font-size="5" text-anchor="middle">FLAP 98.5</text><text x="426.00" y="234.50" font-size="5" text-anchor="middle">DUST FLAP 60</text><text x="426.00" y="276.50" font-size="4.2" text-anchor="middle">HAND HOLE: cut 3 sides, crease the top</text><text x="354.00" y="320.98" text-anchor="middle" font-size="4.2">54.0</text><text x="426.00" y="320.98" text-anchor="middle" font-size="4.2">hole 90.0</text><text x="498.00" y="320.98" text-anchor="middle" font-size="4.2">54.0</text><text x="866.00" y="348.90" font-size="6.0" text-anchor="middle">END 2</text><text x="866.00" y="358.90" font-size="6.0" text-anchor="middle">197.0 x 142.4</text><text x="866.00" y="454.15" font-size="5" text-anchor="middle">FLAP 98.5</text><text x="866.00" y="234.50" font-size="5" text-anchor="middle">DUST FLAP 60</text><text x="866.00" y="276.50" font-size="4.2" text-anchor="middle">HAND HOLE: cut 3 sides, crease the top</text><text x="794.00" y="320.98" text-anchor="middle" font-size="4.2">54.0</text><text x="866.00" y="320.98" text-anchor="middle" font-size="4.2">hole 90.0</text><text x="938.00" y="320.98" text-anchor="middle" font-size="4.2">54.0</text><text x="206.00" y="153.75" font-size="6.0" text-anchor="middle">LID</text><text x="206.00" y="163.75" font-size="6.0" text-anchor="middle">247.0 x 193.5</text><text x="206.00" y="175.75" font-size="5" text-anchor="middle">the tags go on the other face</text><text x="206.00" y="54.50" font-size="5" text-anchor="middle">TUCK FLAP 25</text><text transform="translate(74.10 333.70) rotate(-90)" font-size="5" text-anchor="middle">TAB 25</text><text x="72.50" y="516.40" text-anchor="middle" font-size="5.0">tab 25.0</text><text x="206.00" y="516.40" text-anchor="middle" font-size="5.0">side A 242.0</text><text x="426.00" y="516.40" text-anchor="middle" font-size="5.0">end 1 198.0</text><text x="646.00" y="516.40" text-anchor="middle" font-size="5.0">side B 242.0</text><text x="865.50" y="516.40" text-anchor="middle" font-size="5.0">end 2 197.0</text><text x="512.00" y="534.40" text-anchor="middle" font-size="5.0">overall 904.0</text><text x="206.00" y="25.00" text-anchor="middle" font-size="5.0">lid 247.0</text><text transform="translate(54.00 52.50) rotate(-90)" text-anchor="middle" font-size="5.0">tuck 25.0</text><text transform="translate(54.00 161.75) rotate(-90)" text-anchor="middle" font-size="5.0">lid 193.5</text><text transform="translate(54.00 333.70) rotate(-90)" text-anchor="middle" font-size="5.0">side A 150.4</text><text transform="translate(54.00 458.15) rotate(-90)" text-anchor="middle" font-size="5.0">flap 98.5</text><text transform="translate(34.00 273.70) rotate(-90)" text-anchor="middle" font-size="5.0">overall 467.4</text><text transform="translate(984.00 232.50) rotate(-90)" text-anchor="middle" font-size="5.0">dust flap 60.0</text><text transform="translate(984.00 333.70) rotate(-90)" text-anchor="middle" font-size="5.0">end wall 142.4</text><text transform="translate(984.00 454.15) rotate(-90)" text-anchor="middle" font-size="5.0">flap 98.5</text><text x="1142.50" y="148.50" font-size="6" text-anchor="middle">LINER FLOOR AND LID, cut 2</text><text x="1142.50" y="158.50" font-size="6" text-anchor="middle">237.0 x 193.0</text><text x="1142.50" y="323.20" font-size="6" text-anchor="middle">LINER SIDE, cut 2</text><text x="1142.50" y="333.20" font-size="6" text-anchor="middle">237.0 x 132.4</text><text x="1115.50" y="467.60" font-size="6" text-anchor="middle">LINER END, cut 2</text><text x="1115.50" y="477.60" font-size="6" text-anchor="middle">183.0 x 132.4</text><text x="1115.50" y="416.90" font-size="4.5" text-anchor="middle">notch 110 x 51</text><text x="60.0" y="561.40" font-size="6">Packet cardboard box with hand holes, prototype 2. Board 4 mm. All sizes mm, drawn 1:1, creases at the board mid-plane. This face is the inside of the box.</text><text x="60.0" y="573.40" font-size="6">Solid black: cut. Dashed blue: crease. Every fold goes toward you.</text><text x="60.0" y="585.40" font-size="6">Hand holes: cut the two sides and the bottom, crease the top. Leave the flap flat. The drone's jaw pushes it in.</text><text x="60.0" y="597.40" font-size="6">Fold the walls into a tube and fix the tab inside END 2. Fold the END bottom flaps in first, then the SIDE flaps, and tape the seam.</text><text x="60.0" y="609.40" font-size="6">Fold the dust flaps in, close the lid, tuck its flap inside SIDE B and tape the front edge.</text><text x="60.0" y="621.40" font-size="6">Folded: 246 long, 202 wide, 154.4 to the lid top. Inside 238.0 x 194.0 x 142.4. Blank 904.0 x 467.4.</text><text x="60.0" y="633.40" font-size="6">Green: foil bubble liner, 5 mm thick, a different material. Cut 2 of each. The notch in the END pieces keeps the hand hole clear. Room left for food: 228 x 184 x 132.</text></g>
