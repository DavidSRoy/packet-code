<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="151.20" y="305.95" font-size="7.0" text-anchor="middle">SIDE A (back)</text><text x="151.20" y="430.65" font-size="5" text-anchor="middle">BOTTOM FLAP</text><text x="591.20" y="305.95" font-size="7.0" text-anchor="middle">SIDE B (front)</text><text x="591.20" y="430.65" font-size="5" text-anchor="middle">BOTTOM FLAP</text><text x="371.20" y="315.95" font-size="7.0" text-anchor="middle">END 1</text><text x="371.20" y="426.65" font-size="5" text-anchor="middle">BOTTOM FLAP</text><text x="371.20" y="206.50" font-size="5" text-anchor="middle">LEDGE FLAP</text><text x="371.20" y="249.00" font-size="4.5" text-anchor="middle">JAW SLOT: cut out</text><text x="811.20" y="315.95" font-size="7.0" text-anchor="middle">END 2</text><text x="811.20" y="426.65" font-size="5" text-anchor="middle">BOTTOM FLAP</text><text x="811.20" y="206.50" font-size="5" text-anchor="middle">LEDGE FLAP</text><text x="811.20" y="249.00" font-size="4.5" text-anchor="middle">JAW SLOT: cut out</text><text x="151.20" y="133.75" font-size="7.0" text-anchor="middle">LID</text><text x="151.20" y="143.75" font-size="5" text-anchor="middle">the tags go on the other face</text><text x="151.20" y="26.50" font-size="5" text-anchor="middle">TUCK FLAP</text><text transform="translate(19.30 305.95) rotate(-90)" font-size="5.0" text-anchor="middle">TAB</text><text transform="translate(36.20 367.40) rotate(-90)" font-size="4.5" text-anchor="start">crease 1</text><text transform="translate(278.20 367.40) rotate(-90)" font-size="4.5" text-anchor="start">crease 2</text><text transform="translate(476.20 367.40) rotate(-90)" font-size="4.5" text-anchor="start">crease 3: the corner crease, already there</text><text transform="translate(718.20 367.40) rotate(-90)" font-size="4.5" text-anchor="start">crease 4</text><text transform="translate(477.20 194.50) rotate(-90)" font-size="5" fill="#ad1457">CORNER CREASE of the wardrobe box: lay this line on it</text><text x="13.20" y="527.90" font-size="5" fill="#ad1457">BOTTOM EDGE of the opened wardrobe box: lay this line on it. The blank starts 40 mm above it.</text><text x="592.20" y="196.50" font-size="5" text-anchor="middle">this bar is 200 mm long</text><text transform="translate(698.20 152.50) rotate(-90)" font-size="5" text-anchor="middle">this bar is 100 mm long</text><text x="482.20" y="20.00" font-size="5">Packet cardboard box: print template, 1:1, for 4 mm board. This face is the inside of the box.</text><text x="482.20" y="28.50" font-size="5">Print on Arch D (24 x 36 in) at 100 %, not fit to page. Then measure the two bars below with a ruler.</text><text x="482.20" y="37.00" font-size="5">Lay the board with its inside face up and the flutes running up the walls. Tape this sheet down on it.</text><text x="482.20" y="45.50" font-size="5">On a wardrobe box opened flat: put the CORNER CREASE line on the middle crease and the BOTTOM EDGE line on the bottom edge.</text><text x="482.20" y="54.00" font-size="5">Solid black: cut. Dashed blue: crease. Press the creases through the paper with a blunt point, then cut the solid lines through it.</text><text x="482.20" y="62.50" font-size="5">Cut the jaw slots right out. Their top edge stops 2 mm below the ledge flap crease: do not cut into the crease.</text><text x="482.20" y="71.00" font-size="5">The tab ends 5.2 mm from the left end of the paper and END 2 ends 5.2 mm from the right end. If the plotter</text><text x="482.20" y="79.50" font-size="5">cannot print that close, feed the TAB end last: then only the tab's outer edge is lost, and you can rule it 25 mm from crease 1.</text></g>
</svg>
