ext-anchor="middle">END 1 and END 2</text><text x="497.00" y="445.45" font-size="9" text-anchor="middle">202.0 x 154.9</text><text x="497.00" y="459.45" font-size="8" text-anchor="middle">clear below the slot: 202.0 x 124.9</text><text x="497.00" y="472.45" font-size="8" text-anchor="middle">slot top: 8.0 below the lid top</text><text x="412.50" y="510.10" text-anchor="middle" font-size="8.0">33.0</text><text x="497.00" y="510.10" text-anchor="middle" font-size="8.0">slot 136.0</text><text x="581.50" y="510.10" text-anchor="middle" font-size="8.0">33.0</text><text transform="translate(628.80 361.00) rotate(-90)" text-anchor="middle" font-size="8.0">22.0</text><text transform="translate(628.80 434.45) rotate(-90)" text-anchor="middle" font-size="8.0">124.9</text><text x="786.50" y="196.50" font-size="11.0" text-anchor="middle">LINER FLOOR, cut 1</text><text x="786.50" y="210.50" font-size="9" text-anchor="middle">237.0 x 193.0</text><text x="779.50" y="405.50" font-size="11.0" text-anchor="middle">LINER TOP, cut 1</text><text x="779.50" y="419.50" font-size="9" text-anchor="middle">223.0 x 193.0</text><text x="1043.50" y="164.45" font-size="11.0" text-anchor="middle">LINER SIDE, cut 2</text><text x="1043.50" y="178.45" font-size="9" text-anchor="middle">237.0 x 128.9</text><text x="1016.50" y="309.35" font-size="11.0" text-anchor="middle">LINER END, cut 2</text><text x="1016.50" y="323.35" font-size="9" text-anchor="middle">183.0 x 128.9</text><text x="1016.50" y="248.60" font-size="8" text-anchor="middle">notch 146 x 22</text><text x="396.00" y="100.00" font-size="11" text-anchor="start">Packet cardboard box, prototype 3: folded</text><text x="396.00" y="114.00" font-size="9" text-anchor="start">Board 4 mm. All sizes mm, drawn 1:1.</text><text x="396.00" y="128.00" font-size="9" text-anchor="start">Outside: 246 long, 202 wide, 154.9 high.</text><text x="396.00" y="142.00" font-size="9" text-anchor="start">Inside: 238.0 x 194.0 x 138.9.</text><text x="396.00" y="156.00" font-size="9" text-anchor="start">Black: the outside faces, where tags and labels go.</text><text x="396.00" y="170.00" font-size="9" text-anchor="start">The lid stops 10.7 short of each end. The ledge</text><text x="396.00" y="184.00" font-size="9" text-anchor="start">flaps show there, 4 lower than the lid.</text><text x="396.00" y="198.00" font-size="9" text-anchor="start">The lid's flat face starts 2 in from the back face</text><text x="396.00" y="212.00" font-size="9" text-anchor="start">and stops 6.5 short of the front face.</text><text x="396.00" y="226.00" font-size="9" text-anchor="start">Tape holds the lid to the front wall along its whole</text><text x="396.00" y="240.00" font-size="9" text-anchor="start">front edge and laps onto both faces.</text><text x="396.00" y="254.00" font-size="9" text-anchor="start">Green: foil bubble liner, 5 mm, a different material.</text><text x="396.00" y="268.00" font-size="9" text-anchor="start">Room left for food: 228 x 184 x 129.</text></g>
