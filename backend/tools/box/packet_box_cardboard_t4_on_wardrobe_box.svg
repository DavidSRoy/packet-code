<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="404.0" y="418.0" font-size="22" text-anchor="middle">PANEL 1: spare</text><text x="912.0" y="418.0" font-size="22" text-anchor="middle">PANEL 2</text><text x="1420.0" y="418.0" font-size="22" text-anchor="middle">PANEL 3</text><text x="1928.0" y="418.0" font-size="22" text-anchor="middle">PANEL 4: spare</text><text x="912.0" y="255.0" font-size="22" text-anchor="middle">top flaps: cut off along the crease</text><text x="404.0" y="1462.0" font-size="18" text-anchor="middle">bottom flaps: cut off along the crease</text><text x="1928.0" y="806.0" font-size="22" text-anchor="middle">&#8593; flutes run this way &#8595;</text><text x="1182.0" y="484.0" font-size="22" text-anchor="start">&#8592; put crease 3 on this corner crease</text><text x="404.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="912.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1420.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1928.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text transform="translate(135.60 247.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text transform="translate(135.60 806.00) rotate(-90)" text-anchor="middle" font-size="16.0">panel 864.0</text><text transform="translate(135.60 1365.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text x="679.50" y="1298.40" text-anchor="middle" font-size="16.0">43.0</text><text x="933.50" y="1298.40" text-anchor="middle" font-size="16.0">left of the corner 465.0</text><text x="1385.50" y="1298.40" text-anchor="middle" font-size="16.0">right of the corner 439.0</text><text x="1639.50" y="1298.40" text-anchor="middle" font-size="16.0">69.0</text><text transform="translate(623.60 552.30) rotate(-90)" text-anchor="middle" font-size="16.0">clear 356.6</text><text transform="translate(623.60 964.30) rotate(-90)" text-anchor="middle" font-size="16.0">blank 467.4</text><text transform="translate(623.60 1218.00) rotate(-90)" text-anchor="middle" font-size="16.0">foot 40.0</text><text x="150.0" y="1562.0" font-size="22" text-anchor="start">Medium wardrobe box, 20 x 20 x 34 in, opened flat. Drawn at 1:4, sizes in mm. Board 4 mm.</text><text x="150.0" y="1596.0" font-size="22" text-anchor="start">Panel sizes are the nominal ones from the listing. Measure your box before you cut.</text><text x="150.0" y="1630.0" font-size="22" text-anchor="start">The blank is 904 mm long, longer than one panel, so it spans two. Put crease 3 on the corner crease between them. That crease already folds the right way.</text><text x="150.0" y="1664.0" font-size="22" text-anchor="start">Do not use the corner where the wardrobe box is glued together. Keep hand holes, bar notches and other creases out of the blank.</text><text x="150.0" y="1698.0" font-size="22" text-anchor="start">Cut the wardrobe box open along a different corner and remove its flaps. The blank needs 43 mm and 69 mm of spare panel at its two ends.</text></g>
</svg>
