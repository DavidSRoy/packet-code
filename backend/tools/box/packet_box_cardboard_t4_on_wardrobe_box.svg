<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="404.0" y="418.0" font-size="22" text-anchor="middle">PANEL 1: spare</text><text x="912.0" y="418.0" font-size="22" text-anchor="middle">PANEL 2: body</text><text x="1420.0" y="418.0" font-size="22" text-anchor="middle">PANEL 3: lid</text><text x="1928.0" y="418.0" font-size="22" text-anchor="middle">PANEL 4: spare</text><text x="912.0" y="255.0" font-size="22" text-anchor="middle">top flaps: cut off along the crease</text><text x="404.0" y="1462.0" font-size="18" text-anchor="middle">bottom flaps: cut off along the crease</text><text x="1928.0" y="806.0" font-size="22" text-anchor="middle">&#8593; flutes run this way &#8595;</text><text x="404.0" y="806.0" font-size="22" text-anchor="middle">room for a second body</text><text x="1420.0" y="1093.7" font-size="22" text-anchor="middle">LID</text><text x="404.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="912.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1420.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1928.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text transform="translate(135.60 247.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text transform="translate(135.60 806.00) rotate(-90)" text-anchor="middle" font-size="16.0">panel 864.0</text><text transform="translate(135.60 1365.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text transform="translate(668.15 1324.00) rotate(-90)" text-anchor="end" font-size="16.0">9.1</text><text x="912.00" y="1298.40" text-anchor="middle" font-size="16.0">body 489.8</text><text transform="translate(1167.05 1324.00) rotate(-90)" text-anchor="end" font-size="16.0">9.1</text><text transform="translate(623.60 473.80) rotate(-90)" text-anchor="middle" font-size="16.0">clear 199.6</text><text transform="translate(623.60 885.80) rotate(-90)" text-anchor="middle" font-size="16.0">body 624.4</text><text transform="translate(623.60 1218.00) rotate(-90)" text-anchor="middle" font-size="16.0">foot 40.0</text><text x="1222.50" y="1298.40" text-anchor="middle" font-size="16.0">113.0</text><text x="1420.00" y="1298.40" text-anchor="middle" font-size="16.0">lid 282.0</text><text x="1617.50" y="1298.40" text-anchor="middle" font-size="16.0">113.0</text><text transform="translate(1636.60 673.70) rotate(-90)" text-anchor="middle" font-size="16.0">clear 599.4</text><text transform="translate(1636.60 1085.70) rotate(-90)" text-anchor="middle" font-size="16.0">lid 224.6</text><text transform="translate(1636.60 1218.00) rotate(-90)" text-anchor="middle" font-size="16.0">foot 40.0</text><text x="150.0" y="1562.0" font-size="22" text-anchor="start">Medium wardrobe box, 20 x 20 x 34 in, opened flat. Drawn at 1:4, sizes in mm. Board 4 mm.</text><text x="150.0" y="1596.0" font-size="22" text-anchor="start">Panel sizes are the nominal ones from the listing. Measure your box before you cut.</text><text x="150.0" y="1630.0" font-size="22" text-anchor="start">Cut along the box's own creases, then trim 5 mm inside each one. That leaves 498 mm for the 489.8 mm body, 4.1 mm to spare each side.</text><text x="150.0" y="1664.0" font-size="22" text-anchor="start">Keep hand holes, bar notches and old creases out of both pieces. The panel is 240 mm longer than the body, so slide the body up if the bottom is damaged.</text></g>
</svg>
