<g id="notes" font-family="Helvetica, Arial, sans-serif" fill="#333"><text x="404.0" y="418.0" font-size="22" text-anchor="middle">PANEL 1: spare</text><text x="912.0" y="418.0" font-size="22" text-anchor="middle">PANEL 2</text><text x="1420.0" y="418.0" font-size="22" text-anchor="middle">PANEL 3</text><text x="1928.0" y="418.0" font-size="22" text-anchor="middle">PANEL 4: spare</text><text x="912.0" y="255.0" font-size="22" text-anchor="middle">top flaps: cut off along the crease</text><text x="404.0" y="1462.0" font-size="18" text-anchor="middle">bottom flaps: cut off along the crease</text><text x="1928.0" y="806.0" font-size="22" text-anchor="middle">&#8593; flutes run this way &#8595;</text><text x="1182.0" y="484.0" font-size="22" text-anchor="start">&#8592; put crease 3 on this corner crease</text><text x="404.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="912.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1420.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text x="1928.00" y="80.40" text-anchor="middle" font-size="16.0">panel 508.0</text><text transform="translate(135.60 247.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text transform="translate(135.60 806.00) rotate(-90)" text-anchor="middle" font-size="16.0">panel 864.0</text><text transform="translate(135.60 1365.00) rotate(-90)" text-anchor="middle" font-size="16.0">flap 254.0</text><text x="679.50" y="1298.40" text-anchor="middle" font-size="16.0">43.0</text><text x="933.50" y="1298.40" text-anchor="middle" font-size="16.0">left of the corner 465.0</text><text x="1385.50" y="1298.40" text-anchor="middle" font-size="16.0">right of the corner 439.0</text><text x="1639.50" y="1298.40" text-anchor="middle" font-size="16.0">69.0</text><text transform="translate(623.60 552.05) rotate(-90)" text-anchor="middle" font-size="16.0">clear 356.1</text><text transform="translate(623.60 964.05) rotate(-90)" text-anchor="middle" font-size="16.0">blank 467.9</text><text transform="translate(623.60 1218.00) rotate(-90)" text-anchor="middle" font-size="16.0">foot 40.0</text><text transform="translate(706.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">465.0</text><text transform="translate(731.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">440.0</text><text transform="translate(973.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">198.0</text><text transform="translate(1413.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">242.0</text><text transform="translate(1610.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">439.0</text><text transform="translate(1171.60 1380.80) rotate(-90)" text-anchor="end" font-size="16.0">0</text><text x="687.0" y="1374.0" font-size="16" text-anchor="end">from the corner crease:</text><text x="495.20" y="1203.60" text-anchor="end" font-size="16.0">40.0</text><text x="495.20" y="1105.10" text-anchor="end" font-size="16.0">138.5</text><text x="495.20" y="958.20" text-anchor="end" font-size="16.0">285.4</text><text x="495.20" y="898.20" text-anchor="end" font-size="16.0">345.4</text><text x="495.20" y="760.70" text-anchor="end" font-size="16.0">482.9</text><text x="495.20" y="735.70" text-anchor="end" font-size="16.0">507.9</text><text x="495.20" y="1243.60" text-anchor="end" font-size="16.0">0</text><text x="518.0" y="704.1" font-size="16" text-anchor="end">up from the bottom edge:</text><text x="150.0" y="1562.0" font-size="22" text-anchor="start">Medium wardrobe box, 20 x 20 x 34 in, opened flat, inside face up. Drawn at 1:4, sizes in mm. Board 4 mm.</text><text x="150.0" y="1596.0" font-size="22" text-anchor="start">Panel sizes are the nominal ones from the listing. Measure your box before you cut.</text><text x="150.0" y="1630.0" font-size="22" text-anchor="start">Cut the box open down its glued corner and cut the flaps off. The middle crease is the corner crease: crease 3 of the blank goes on it, and it already folds the right way.</text><text x="150.0" y="1664.0" font-size="22" text-anchor="start">Measure along from the corner crease and up from the bottom edge. The guide ending _on_wardrobe_box_guide.md lists every line.</text><text x="150.0" y="1698.0" font-size="22" text-anchor="start">Keep hand holes, bar notches and other creases out of the blank. If one is in the way, move the whole blank up: there is 356 mm to spare.</text></g>
</svg>
