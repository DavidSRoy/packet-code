[project]
name = "flightsim"
version = "0.1.0"
description = "Flight simulator for delivery drone experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python-headless==4.12.0.88",
    "pymavlink>=2.4.50",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
